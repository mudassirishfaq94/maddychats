[package]
name = "maddy-signal-bridge"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
libsignal-protocol = { git = "https://github.com/signalapp/libsignal.git", rev = "8fc2113bda042fc972a166a24b974b0d34155c6c", package = "libsignal-protocol" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2.108"
