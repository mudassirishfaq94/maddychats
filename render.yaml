services:
  - type: web
    runtime: node
    name: circlo
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CLIENT_URL
        value: "https://maddychats.onrender.com"
      - key: GOOGLE_CALLBACK_URL
        value: "https://maddychats.onrender.com/api/auth/google/callback"
