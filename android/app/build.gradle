apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// Owner approved chat.circlo.app for a new Play listing; Java namespace stays unchanged.
def appOrigin = System.getenv('CLIENT_URL') ?: 'https://circlo.chat'
if (appOrigin != 'https://circlo.chat') throw new GradleException('Android builds must use the canonical https://circlo.chat origin.')

android {
    namespace = "app.ziptalks.android"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "chat.circlo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 19
        versionName "0.9.10"
        manifestPlaceholders = [appLinkHost: 'circlo.chat']
        buildConfigField "String", "API_BASE_URL", '"' + appOrigin + '"'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            // R8 shrinks, obfuscates and optimizes the DEX. With a hosted WebView
            // the web bundle is the big cost, but shrinking the native Kotlin
            // graph (Credentials, OkHttp, Firebase) cuts APK size and
            // cold-start DEX verification time. Keep the existing rules file.
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // The active UI is the hosted WebView; retain only its Activity integration.
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "androidx.activity:activity-ktx:$androidxActivityVersion"
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:okhttp-sse:4.12.0'
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Firebase Cloud Messaging for native push notifications
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

// Deployment-specific client configuration stays local. Never silently build a
// release with another package's Firebase identity or disabled native push.
def servicesJSON = file('google-services.json')
if (!servicesJSON.exists()) throw new GradleException('Provide android/app/google-services.json from the existing Firebase project for chat.circlo.app. Do not use a server service-account file.')
def firebaseClientConfig = new groovy.json.JsonSlurper().parse(servicesJSON)
def firebasePackages = firebaseClientConfig.client.collect { it.client_info?.android_client_info?.package_name }
if (!firebasePackages.contains(android.defaultConfig.applicationId)) {
    throw new GradleException('Firebase Android client does not match chat.circlo.app. Download the matching google-services.json; do not reuse the legacy package client.')
}
apply plugin: 'com.google.gms.google-services'

// Package the same public-only composer for native cold starts without network.
def offlineShellAssets = layout.buildDirectory.dir('generated/offlineShell/assets')
android.sourceSets.main.assets.srcDir(offlineShellAssets)
def copyOfflineShell = tasks.register('copyOfflineShell', Copy) {
    from('../../public') {
        include 'offline.html', 'offline.css', 'offline-compose.js', 'offline-store.js', 'icons/circlo-mark.svg'
    }
    into(offlineShellAssets.map { it.dir('circlo-offline') })
}
tasks.named('preBuild').configure { dependsOn(copyOfflineShell) }
