<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="theme-color" content="#151719"><title>Circlo | Chats</title><link rel="stylesheet" href="/offline.css"><script type="module" src="/offline-compose.js"></script></head>
<body><div class="app"><header class="app-header"><a href="/app/chats" id="home" aria-label="Circlo home"><img src="/icons/circlo-mark.svg" width="28" height="28" alt=""><strong>circlo</strong></a><span id="connection">Offline</span><button id="theme" aria-label="Change theme" title="Change theme"></button></header><main><aside aria-label="Conversations"><div class="list-heading"><h1>Chats</h1><button id="new-chat" aria-label="New chat" title="New chat"></button></div><div class="search-wrap"><label class="sr-only" for="search">Search conversations</label><input id="search" type="search" placeholder="Search conversations..."></div><div id="filters" role="group" aria-label="Chat filters"></div><div id="conversations" role="list"></div><p id="empty-list" hidden></p><div class="list-foot">Saved on this device <button id="retry">Reconnect</button></div></aside><section id="conversation" aria-label="Chat" hidden><header class="chat-header"><button id="back" aria-label="Back to chats"></button><span id="chat-avatar" class="avatar"></span><div class="chat-identity"><h2 id="chat-name"></h2><p id="chat-status">Offline</p></div><button id="call" aria-label="Start audio call" title="Calls need an internet connection"></button></header><div id="messages" role="region" aria-label="Messages"></div><div id="compose-area"><form id="compose"><div class="composer"><button type="button" id="attach" aria-label="Attach a file"></button><label class="sr-only" for="text">Message text</label><textarea id="text" placeholder="Message..." maxlength="2000" rows="1" required disabled></textarea><button id="send" aria-label="Send message" disabled></button></div></form><p id="notice" role="status">No internet connection. Messages will send automatically when you're back online.</p></div></section><div id="choose-chat"><img src="/icons/circlo-mark.svg" alt="" width="64" height="64"><h2>Your conversations, right here.</h2><p>Choose a chat to keep writing while you're offline.</p></div></main><nav id="navigation" aria-label="Mobile navigation"></nav><div id="feedback" role="status" hidden></div></div></body></html>
