<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#0f766e"><title>ZipTalk - Offline</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#0b1211;color:#effaf7;font:16px/1.6 system-ui;padding:24px}main{max-width:360px;text-align:center}h1{font-size:26px;margin-bottom:8px}p{color:#b4c9c4}button{font:inherit;font-weight:600;border:0;border-radius:14px;background:#0f766e;color:white;padding:13px 28px;cursor:pointer}button:focus-visible{outline:3px solid #5eead4;outline-offset:4px}</style></head>
<body><main><h1>You're offline</h1><p>Connect to the internet to open ZipTalk and send or receive messages.</p><button id="retry">Try again</button></main><script>document.getElementById('retry').addEventListener('click',()=>location.reload());window.addEventListener('online',()=>location.reload());</script></body></html>
