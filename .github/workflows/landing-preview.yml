name: Circlo landing preview
on:
  push:
    branches: ['codex/circlo-landing-*']
    paths: ['tests/fixtures/circlo-landing.html', 'scripts/check-landing.mjs', '.github/workflows/landing-preview.yml']
  pull_request:
    paths: ['tests/fixtures/circlo-landing.html', 'scripts/check-landing.mjs', '.github/workflows/landing-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/harden-braces.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-landing.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: circlo-landing-preview
          path: landing-preview/
          if-no-files-found: ignore
