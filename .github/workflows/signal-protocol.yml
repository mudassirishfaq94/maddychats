name: Signal protocol foundation
on:
  pull_request:
    paths:
      - 'signal-bridge/**'
      - 'public/signal/ratchet-v1/**'
      - 'src/lib/*signal*'
      - 'src/lib/signal-*'
      - 'scripts/test-signal-*'
      - 'tests/signal-*'
      - '.github/workflows/signal-protocol.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signal-foundation-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  protocol-and-browser-storage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - name: Install locked JavaScript dependencies and browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install protocol compiler tools
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            signal-bridge/target
          key: signal-${{ runner.os }}-1.99.1-${{ hashFiles('signal-bridge/Cargo.lock') }}
      - name: Protocol format and native regression tests
        run: |
          cargo +1.99.1 fmt --manifest-path signal-bridge/Cargo.toml --check
          cargo +1.99.1 test --locked --manifest-path signal-bridge/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path signal-bridge/Cargo.toml --all-targets -- -D warnings
      - name: Rebuild the actual browser adapter
        run: |
          cargo +1.99.1 build --locked --release --target wasm32-unknown-unknown --manifest-path signal-bridge/Cargo.toml
          cargo +1.99.1 install --locked wasm-bindgen-cli --version 0.2.128
          wasm-bindgen signal-bridge/target/wasm32-unknown-unknown/release/maddy_signal_bridge.wasm --target web --out-dir public/signal/ratchet-v1
      - name: Real browser protocol and encrypted-storage regressions
        run: |
          node --import tsx --test tests/signal-ratchet-contract.test.ts
          node scripts/test-signal-wasm.mjs
          node scripts/test-signal-store.mjs
