name: Quality

on:
  push:
    branches: [main, master, 'codex/audit-remainder-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, build, security and integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      clamav:
        image: clamav/clamav:1.4
        ports: ["3310:3310"]
        options: >-
          --health-cmd "clamdcheck.sh"
          --health-interval 20s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 300s
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: circlo_ci
          POSTGRES_PASSWORD: disposable-ci-database-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U circlo_ci -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Isolated loopback fixture gateway supplies one verified forwarding hop.
      CLIENT_IP_TRUSTED_HOPS: "1"
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: circlo_ci
      PGPASSWORD: disposable-ci-database-only
      DATABASE_URL: postgresql://circlo_ci:disposable-ci-database-only@127.0.0.1:5432/item1_security_test
      ITEM1_TEST_DATABASE_URL: postgresql://circlo_ci:disposable-ci-database-only@127.0.0.1:5432/item1_security_test
      ITEM2_TEST_DATABASE_URL: postgresql://circlo_ci:disposable-ci-database-only@127.0.0.1:5432/item2_deployment_test
      ITEM3_TEST_DATABASE_URL: postgresql://circlo_ci:disposable-ci-database-only@127.0.0.1:5432/item3_authorization_test
      ITEM456_TEST_DATABASE_URL: postgresql://circlo_ci:disposable-ci-database-only@127.0.0.1:5432/items456_quality_test
      REMAINING_TEST_DATABASE_URL: postgresql://circlo_ci:disposable-ci-database-only@127.0.0.1:5432/remaining_hardening_test
      REMAINING_BROWSER_TESTS: "1"
      ITEM456_BROWSER_TESTS: "1"
      PROFILE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Full Git history secret scan
        id: secrets
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          mkdir -p .freebuff/security-scanner
          cd .freebuff/security-scanner
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}" -o "$archive"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_checksums.txt" -o checksums.txt
          grep "  ${archive}$" checksums.txt | sha256sum --check
          tar -xzf "$archive" gitleaks
          cd ../..
          scan_status=0
          .freebuff/security-scanner/gitleaks git --log-opts='--all' --redact=100 --no-banner --report-format json --report-path .freebuff/security-scanner/findings.json || scan_status=$?
          node - <<'JS'
          const fs = require('node:fs');
          const file = '.freebuff/security-scanner/findings.json';
          if (fs.existsSync(file)) for (const finding of JSON.parse(fs.readFileSync(file,'utf8'))) {
            // Report only locations and detector IDs, never match/secret values.
            console.log(JSON.stringify({rule:finding.RuleID,file:finding.File,line:finding.StartLine,commit:finding.Commit,fingerprint:finding.Fingerprint}));
          }
          JS
          exit "$scan_status"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-16
      - run: npm ci
      - name: Install mobile lab browser
        run: npx playwright install --with-deps chromium
      - name: Dependency audit
        run: |
          npm audit --omit=dev --audit-level=high
          npm run audit:dependencies
      - name: Real scanner integration
        env:
          CLAMAV_HOST: 127.0.0.1
          CLAMAV_PORT: "3310"
        run: npm run test:scanner
      - run: npm run lint
      - run: npm run typecheck
      - name: Production build with fake secret canaries
        env:
          RESEND_API_KEY: circlo-audit-resend-canary-20261013
          GOOGLE_CLIENT_SECRET: circlo-audit-google-canary-20261013
          JWT_SECRET: circlo-audit-jwt-canary-at-least-thirty-two-chars
        run: npm run build
      - name: Browser credential exposure regression
        run: node scripts/check-client-secrets.mjs
      - name: Prepare account-security database
        run: |
          createdb item1_security_test
          npm run db:migrate
      - name: Data API role isolation
        run: npx tsx scripts/test-data-api-boundary.ts
      - name: Unit and isolated integration suites
        run: npm test
      - name: Offline PWA fallback under enforced CSP
        run: npm run test:pwa-offline
      - name: TWA configuration boundaries without Android tooling or credentials
        run: node --test android-twa/tests/*.test.mjs
      - name: Session, password-reset and mobile retry regressions
        env:
          LOAD_TEST_ADMIN_URL: postgresql://circlo_ci:disposable-ci-database-only@127.0.0.1:5432/postgres
        run: |
          npx tsx scripts/test-session-query.ts
            npx tsx scripts/test-authentication-audit.ts
          node scripts/test-login-backoff.mjs
      - name: Verification-code security and provider integration
        run: npm run test:verification && npx tsx scripts/test-recovery-email.ts && npx tsx scripts/test-password-reset.ts && npm run test:verification-template && npm run test:send
      - name: Landing page regression
        run: node scripts/check-landing.mjs
      - name: Production container build and readiness smoke test
        shell: bash
        run: |
          set -euo pipefail
          createdb docker_quality_test
          image_db="postgresql://circlo_ci:disposable-ci-database-only@127.0.0.1:5432/docker_quality_test"
          DATABASE_URL="$image_db" npm run db:migrate
          docker build --target runner --tag ziptalk-quality:local .
          cleanup_image() {
            if [ "${image_ready:-0}" != "1" ]; then docker logs ziptalk-quality-smoke || true; fi
            docker rm -f ziptalk-quality-smoke >/dev/null 2>&1 || true
          }
          trap cleanup_image EXIT
          docker run --detach --name ziptalk-quality-smoke --network host \
            --env DATABASE_URL="$image_db" \
            --env JWT_SECRET=disposable-container-only-secret-at-least-thirty-two-characters \
            --env HEALTHCHECK_SECRET=disposable-container-health \
            --env CRON_SECRET=disposable-container-cron \
            --env CLIENT_URL=http://127.0.0.1:3000 \
            --env CLAMAV_HOST=127.0.0.1 --env CLAMAV_PORT=3310 \
            ziptalk-quality:local
          for attempt in $(seq 1 60); do
            if docker exec ziptalk-quality-smoke node scripts/readiness.mjs; then image_ready=1; break; fi
            sleep 1
          done
          test "${image_ready:-0}" = "1"
          test "$(docker exec ziptalk-quality-smoke id -u)" = "1001"
          docker exec ziptalk-quality-smoke node -e "const fs=require('fs'); fs.accessSync('/app/server/uploads',fs.constants.W_OK); fs.accessSync('/app/.next/cache',fs.constants.W_OK);"
      - name: Enforce Git history secret scan result
        if: always() && steps.secrets.outcome != 'success'
        run: exit 1
      - name: Save local lab measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-and-database-lab
          path: .freebuff/performance/*.json
          if-no-files-found: ignore
