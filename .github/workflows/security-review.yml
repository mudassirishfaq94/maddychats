name: Circlo security reconnaissance
on:
  push:
    branches: ['codex/security-review-20261013']
permissions:
  contents: read
jobs:
  reconnaissance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - name: Read installed Next.js security guidance
        run: |
          find node_modules/next/dist/docs -type f | grep -E '(proxy|headers|server-and-client-components|security|environment-variables)' > /tmp/next-guides.txt
          while IFS= read -r guide; do
            echo "GUIDE: $guide"
            head -n 160 "$guide"
          done < /tmp/next-guides.txt
      - name: Install verified secret scanner
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: History, source inventory and public exposure checks
        run: python3 scripts/security-recon.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redacted-security-audit
          path: |
            /tmp/security-audit/history-findings.json
            /tmp/security-audit/current-findings.json
            /tmp/security-audit/routes.json
            /tmp/security-audit/public-probes.json
            /tmp/security-audit/environment-references.json
          retention-days: 7
